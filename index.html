<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wydatki MW">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F5F2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1412">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Wydatki MW</title>
<style>
:root{color-scheme:light dark}
html,body{margin:0;height:100%;background:#F4F5F2;color:#16201C;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme: dark){html,body{background:#0F1412;color:#E6ECE8}}
.box{max-width:420px;margin:0 auto;padding:calc(60px + env(safe-area-inset-top)) 22px 40px;text-align:center}
.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#34D399,#0E7C66);display:grid;place-items:center;color:#fff;font-weight:800;font-size:26px;margin:0 auto 18px}
.spin{width:26px;height:26px;border:3px solid rgba(127,127,127,.3);border-top-color:#0E7C66;border-radius:50%;animation:s .8s linear infinite;margin:18px auto}
@keyframes s{to{transform:rotate(360deg)}}
input{width:100%;box-sizing:border-box;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid rgba(127,127,127,.35);background:transparent;color:inherit;margin-top:14px}
button{width:100%;margin-top:12px;font-size:17px;font-weight:700;padding:14px;border:0;border-radius:12px;background:#0E7C66;color:#fff}
.err{color:#DC2626;margin-top:14px;font-size:14px}
.muted{opacity:.65;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="box" id="box"><div class="logo">zł</div><b>Wydatki MW</b><div class="spin"></div><div class="muted">Wczytuję…</div></div>
<script>
(function () {
const API = 'https://script.google.com/macros/s/AKfycbw7jBojO0XjYC779EyQ6KLv7AVEfplhXWTYTLXivLwZrWlvGRPMe6-6T9jKb6dSPKYCLg/exec';
const KEY_NAME = 'wmw_key';
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };

async function call(fn, args, view) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify({ key: store.get(KEY_NAME), fn, args, view, base: location.origin + location.pathname }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Błąd serwera');
  return fn === 'ui' ? j.html : j.result;
}

/* Zamiennik google.script.run – ten sam kod aplikacji działa bez zmian */
function runner() {
  let ok = null, fail = null;
  const p = new Proxy({}, { get(_, name) {
    if (name === 'withSuccessHandler') return f => { ok = f; return p; };
    if (name === 'withFailureHandler') return f => { fail = f; return p; };
    if (name === 'withUserObject') return () => p;
    return (...args) => { call(name, args).then(r => ok && ok(r)).catch(e => fail ? fail(e) : console.error(e)); };
  } });
  return p;
}
window.google = { script: { get run() { return runner(); }, host: { close() {} } } };

function askKey(msg) {
  document.getElementById('box').innerHTML = `<div class="logo">zł</div><b>Wydatki MW</b>
    <p class="muted">Wklej klucz dostępu (jednorazowo na tym urządzeniu).</p>
    <input id="k" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="klucz">
    <button id="b">Otwórz aplikację</button>${msg ? `<div class="err">${msg}</div>` : ''}`;
  document.getElementById('b').onclick = () => { const v = document.getElementById('k').value.trim(); if (v) { store.set(KEY_NAME, v); start(); } };
}

const HEAD = document.head.innerHTML.split('<style>')[0];
async function start() {
  if (!store.get(KEY_NAME)) return askKey();
  const q = new URLSearchParams(location.search);
  const view = q.get('v') === 'm' || (!q.get('v') && Math.min(screen.width, screen.height) < 700) ? 'm' : 'd';
  try {
    let html = await call('ui', [], view);
    html = html.replace(/<head>/i, '<head>' + HEAD);
    document.open(); document.write(html); document.close();
  } catch (e) {
    if (/klucz/i.test(e.message)) { store.set(KEY_NAME, null); askKey('Nieprawidłowy klucz – spróbuj jeszcze raz.'); }
    else document.getElementById('box').innerHTML = `<div class="logo">zł</div><b>Wydatki MW</b><div class="err">Nie udało się połączyć: ${e.message}</div><button onclick="location.reload()">Spróbuj ponownie</button>`;
  }
}
start();
})();
</script>
</body>
</html>
